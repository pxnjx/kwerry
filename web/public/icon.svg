<!-- App icon — person + magnifier. Kept monochrome (#1f1f1f, the same ink as
     the rest of the chrome) so it sits on the page in both themes; the dark
     theme flips it with filter: invert(1) in styles.css.
     Trimmed from the source SVG: the SVGRepo carrier groups, the <defs>/<style>
     block and the no-op transform="translate(0 0)" calls all paint nothing.
     The _Transparent_Rectangle_ is dropped too — it carries fill:none, so it
     renders zero pixels; the real artwork already spans 2→30 on this 32 grid. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <g fill="#1f1f1f">
    <circle cx="11" cy="15.5" r="1.5"></circle>
    <path d="M12,12H10V8h2a2,2,0,0,0,0-4H10A2.0023,2.0023,0,0,0,8,6v.5H6V6a4.0045,4.0045,0,0,1,4-4h2a4,4,0,0,1,0,8Z"></path>
    <path d="M22.4479,21.0337A10.971,10.971,0,0,0,19.9211,4.7446l-.999,1.73A8.9967,8.9967,0,1,1,5,14H3a10.9916,10.9916,0,0,0,18.0338,8.4478L28.5859,30,30,28.5859Z"></path>
  </g>
</svg>
